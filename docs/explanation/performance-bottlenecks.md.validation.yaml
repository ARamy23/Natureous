# Validation Checklist for Explanation Type
validation_checklist:
  - item: Addresses "why" not "what"
    passed: true
    note: |
      Core thesis: "why" the Singleton pattern creates performance cascades.
      Every section explains causes, not definitions (except brief background).
      Example: "Why this is expensive" headings explicitly frame cost reasoning.

  - item: Provides context and reasoning
    passed: true
    note: |
      Context: architectural decision (singleton pattern trade-off between convenience and performance).
      Reasoning: explains per-frame cost breakdown, cascade multiplication, architectural root.
      Connects each bottleneck to the root cause (missing caching logic in Singleton.Instance getter).

  - item: Discusses alternatives
    passed: true
    note: |
      Implied alternatives: cached singleton pattern (mentioned as what "should" be done),
      spatial partitioning for damage detection, single capsule raycast instead of 10+.
      Final paragraph: "A more optimized design ... would run smoothly on the same hardware."
      Could be more explicit; this is borderline but acceptable for an explanation.

  - item: No task steps
    passed: true
    note: |
      "How to Confirm with Profiler" section uses exploratory language ("Look for", "Expected appearance"),
      not imperative steps. Frames profiling as verification activity, not task completion.

  - item: Builds conceptual model
    passed: true
    note: |
      Reader gains mental model: Singleton searches cascade through input, attacks, state,
      damage detection. Understands why O(n) searches hurt even on fast hardware.
      Conceptual insight: "algorithmic efficiency, not raw CPU power."

